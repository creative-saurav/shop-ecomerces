<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful - Zipley</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', } } } } }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased flex flex-col min-h-screen">

    <header class="bg-white shadow-sm border-b border-gray-100 py-4">
        <div class="container mx-auto px-4 text-center">
            <a href="index.html" class="inline-flex items-center space-x-2">
                <div class="w-10 h-10 bg-brand-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">Z</div>
                <span class="text-2xl font-bold tracking-tight text-gray-900">Zipley</span>
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 md:p-12 max-w-lg w-full text-center">
            <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="ph-fill ph-check-circle text-5xl"></i>
            </div>
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">Order Confirmed!</h1>
            <p class="text-gray-500 mb-6">Thank you for your purchase. Your order has been received and is being processed.</p>
            
            <div class="bg-gray-50 border border-gray-100 rounded-lg p-4 mb-8 text-left">
                <div class="flex justify-between mb-2">
                    <span class="text-gray-500 text-sm">Order ID:</span>
                    <span class="font-bold text-gray-900">#ZP-9843210</span>
                </div>
                <div class="flex justify-between mb-2">
                    <span class="text-gray-500 text-sm">Date:</span>
                    <span class="font-medium text-gray-900">Oct 24, 2026</span>
                </div>
                <div class="flex justify-between mb-2">
                    <span class="text-gray-500 text-sm">Email:</span>
                    <span class="font-medium text-gray-900">john@example.com</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-500 text-sm">Estimated Delivery:</span>
                    <span class="font-medium text-brand-600">Oct 27 - Oct 29</span>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4">
                <a href="order-tracking.html" class="flex-1 border border-gray-300 text-gray-700 hover:bg-gray-50 font-bold py-3 rounded-lg transition">Track Order</a>
                <a href="index.html" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-lg transition shadow-md hover:shadow-lg">Continue Shopping</a>
            </div>
        </div>
    </main>

</body>
</html>
