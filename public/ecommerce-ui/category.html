<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronics - Zipley</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    
    <!-- Header (Simplified for demo) -->
    <header class="bg-white sticky top-0 z-50 shadow-sm border-b border-gray-100">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center space-x-2">
                <div class="w-10 h-10 bg-brand-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">Z</div>
                <span class="text-2xl font-bold tracking-tight text-gray-900 hidden md:block">Zipley</span>
            </a>
            <div class="flex-1 max-w-2xl hidden md:flex">
                <form action="search.html" class="w-full flex relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="ph ph-magnifying-glass text-gray-400 text-xl"></i>
                    </div>
                    <input type="text" class="w-full pl-10 pr-4 py-2 bg-gray-100 border-transparent rounded-l-lg focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-200 transition-all outline-none" placeholder="Search...">
                    <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white px-6 py-2 rounded-r-lg font-medium transition">Search</button>
                </form>
            </div>
            <div class="flex items-center space-x-4 sm:space-x-6">
                <a href="account.html" class="text-gray-600 hover:text-brand-600"><i class="ph ph-user text-2xl"></i></a>
                <a href="cart.html" class="text-gray-600 hover:text-brand-600 relative">
                    <i class="ph ph-shopping-cart text-2xl"></i>
                    <span class="absolute -top-1.5 -right-2 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">3</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6">
        
        <!-- Breadcrumb -->
        <nav class="flex text-sm text-gray-500 mb-6">
            <ol class="flex items-center space-x-2">
                <li><a href="index.html" class="hover:text-brand-600">Home</a></li>
                <li><i class="ph ph-caret-right text-xs"></i></li>
                <li><a href="#" class="hover:text-brand-600">Electronics</a></li>
                <li><i class="ph ph-caret-right text-xs"></i></li>
                <li class="text-gray-800 font-medium">Phones</li>
            </ol>
        </nav>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Left Sidebar Filter -->
            <aside class="w-full lg:w-1/4 xl:w-1/5 flex flex-col gap-6">
                
                <!-- Filter Section: Categories -->
                <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                    <h3 class="font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">Categories</h3>
                    <ul class="space-y-2 text-sm text-gray-600 custom-scrollbar max-h-48 overflow-y-auto">
                        <li>
                            <label class="flex items-center justify-between cursor-pointer group">
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" class="rounded text-brand-600 focus:ring-brand-500 cursor-pointer" checked>
                                    <span class="group-hover:text-brand-600">Smartphones</span>
                                </div>
                                <span class="text-gray-400 text-xs">(120)</span>
                            </label>
                        </li>
                        <li>
                            <label class="flex items-center justify-between cursor-pointer group">
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" class="rounded text-brand-600 focus:ring-brand-500 cursor-pointer">
                                    <span class="group-hover:text-brand-600">Feature Phones</span>
                                </div>
                                <span class="text-gray-400 text-xs">(45)</span>
                            </label>
                        </li>
                        <li>
                            <label class="flex items-center justify-between cursor-pointer group">
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" class="rounded text-brand-600 focus:ring-brand-500 cursor-pointer">
                                    <span class="group-hover:text-brand-600">Refurbished Phones</span>
                                </div>
                                <span class="text-gray-400 text-xs">(32)</span>
                            </label>
                        </li>
                    </ul>
                </div>

                <!-- Filter Section: Price -->
                <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                    <h3 class="font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">Price Range</h3>
                    <div class="space-y-4">
                        <input type="range" min="0" max="2000" value="1000" class="w-full accent-brand-600 h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        <div class="flex items-center justify-between gap-2">
                            <input type="number" placeholder="Min" class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:outline-none focus:border-brand-500">
                            <span class="text-gray-400">-</span>
                            <input type="number" placeholder="Max" class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:outline-none focus:border-brand-500">
                        </div>
                    </div>
                </div>

                <!-- Filter Section: Brand -->
                <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                    <h3 class="font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">Brand</h3>
                    <div class="mb-3 relative">
                        <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-gray-400"></i>
                        <input type="text" placeholder="Search brand..." class="w-full pl-9 pr-3 py-2 text-sm bg-gray-50 border border-transparent rounded focus:bg-white focus:border-brand-500 focus:outline-none">
                    </div>
                    <ul class="space-y-2 text-sm text-gray-600 custom-scrollbar max-h-40 overflow-y-auto">
                        <li>
                            <label class="flex items-center justify-between cursor-pointer group">
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" class="rounded text-brand-600 focus:ring-brand-500 cursor-pointer">
                                    <span class="group-hover:text-brand-600">Apple</span>
                                </div>
                            </label>
                        </li>
                        <li>
                            <label class="flex items-center justify-between cursor-pointer group">
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" class="rounded text-brand-600 focus:ring-brand-500 cursor-pointer">
                                    <span class="group-hover:text-brand-600">Samsung</span>
                                </div>
                            </label>
                        </li>
                        <li>
                            <label class="flex items-center justify-between cursor-pointer group">
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" class="rounded text-brand-600 focus:ring-brand-500 cursor-pointer">
                                    <span class="group-hover:text-brand-600">Xiaomi</span>
                                </div>
                            </label>
                        </li>
                        <li>
                            <label class="flex items-center justify-between cursor-pointer group">
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" class="rounded text-brand-600 focus:ring-brand-500 cursor-pointer">
                                    <span class="group-hover:text-brand-600">OnePlus</span>
                                </div>
                            </label>
                        </li>
                    </ul>
                </div>

                <!-- Filter Section: Rating -->
                <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                    <h3 class="font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">Rating</h3>
                    <ul class="space-y-2">
                        <li>
                            <label class="flex items-center gap-2 cursor-pointer group">
                                <input type="radio" name="rating" class="text-brand-600 focus:ring-brand-500 cursor-pointer">
                                <div class="flex text-yellow-400 text-sm">
                                    <i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i>
                                </div>
                                <span class="text-xs text-gray-500">& Up</span>
                            </label>
                        </li>
                        <li>
                            <label class="flex items-center gap-2 cursor-pointer group">
                                <input type="radio" name="rating" class="text-brand-600 focus:ring-brand-500 cursor-pointer">
                                <div class="flex text-yellow-400 text-sm">
                                    <i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i><i class="ph ph-star text-gray-300"></i>
                                </div>
                                <span class="text-xs text-gray-500">& Up</span>
                            </label>
                        </li>
                    </ul>
                </div>

                <!-- Availability Toggle -->
                <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between cursor-pointer">
                    <span class="font-bold text-gray-900 text-sm">In Stock Only</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" value="" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-600"></div>
                    </label>
                </div>
            </aside>

            <!-- Right Product Grid Area -->
            <div class="flex-1">
                <!-- Top Bar -->
                <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                    <p class="text-sm text-gray-500">Showing <span class="font-bold text-gray-900">1-12</span> of <span class="font-bold text-gray-900">120</span> products</p>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2">
                            <label class="text-sm text-gray-500">Sort by:</label>
                            <select class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 text-gray-700 bg-white cursor-pointer">
                                <option>Recommended</option>
                                <option>Newest Arrivals</option>
                                <option>Price: Low to High</option>
                                <option>Price: High to Low</option>
                                <option>Top Rated</option>
                            </select>
                        </div>
                        <div class="hidden sm:flex border border-gray-200 rounded-lg overflow-hidden">
                            <button class="px-3 py-1.5 bg-gray-100 text-brand-600 hover:bg-gray-200 transition"><i class="ph-fill ph-squares-four text-lg"></i></button>
                            <button class="px-3 py-1.5 bg-white text-gray-500 hover:bg-gray-50 transition"><i class="ph ph-list text-lg"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Active Filters -->
                <div class="flex flex-wrap gap-2 mb-6">
                    <span class="inline-flex items-center gap-1 bg-brand-50 border border-brand-200 text-brand-700 text-xs px-3 py-1.5 rounded-full">
                        Smartphones <i class="ph ph-x cursor-pointer hover:text-red-500"></i>
                    </span>
                    <span class="inline-flex items-center gap-1 bg-brand-50 border border-brand-200 text-brand-700 text-xs px-3 py-1.5 rounded-full">
                        $0 - $1000 <i class="ph ph-x cursor-pointer hover:text-red-500"></i>
                    </span>
                    <button class="text-xs text-red-500 hover:underline font-medium ml-2">Clear All</button>
                </div>

                <!-- Products Grid -->
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6 mb-8">
                    
                    <!-- Product Card -->
                    <div class="bg-white border border-gray-100 rounded-xl p-4 hover:shadow-lg transition relative group flex flex-col">
                        <span class="absolute top-3 left-3 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded z-10">-10%</span>
                        <div class="relative mb-4 h-48 bg-gray-50 rounded-lg overflow-hidden flex items-center justify-center p-4">
                            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=400&q=80" alt="Product" class="h-full object-contain mix-blend-multiply group-hover:scale-105 transition duration-300">
                            <div class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2">
                                <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-gray-700 hover:text-red-500 hover:shadow-md transition transform translate-y-4 group-hover:translate-y-0"><i class="ph ph-heart text-xl"></i></button>
                            </div>
                        </div>
                        <div class="flex-1 flex flex-col">
                            <a href="product.html" class="block font-medium text-gray-800 hover:text-brand-600 transition line-clamp-2 mb-1">iPhone 13 Pro - 256GB - Sierra Blue</a>
                            <div class="flex items-center gap-1 mb-2">
                                <i class="ph-fill ph-star text-yellow-400 text-sm"></i>
                                <span class="text-xs text-gray-500">4.9 (420)</span>
                            </div>
                            <div class="mt-auto">
                                <div class="flex items-baseline gap-2 mb-3">
                                    <span class="text-lg font-bold text-brand-600">$899.00</span>
                                    <span class="text-sm text-gray-400 line-through">$999.00</span>
                                </div>
                                <button class="w-full bg-brand-50 hover:bg-brand-600 text-brand-700 hover:text-white font-medium py-2 rounded-lg transition flex items-center justify-center gap-2 text-sm border border-brand-200 hover:border-brand-600">
                                    <i class="ph ph-shopping-cart-simple text-lg"></i> Add to Cart
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Product Card -->
                    <div class="bg-white border border-gray-100 rounded-xl p-4 hover:shadow-lg transition relative group flex flex-col">
                        <div class="relative mb-4 h-48 bg-gray-50 rounded-lg overflow-hidden flex items-center justify-center p-4">
                            <img src="https://images.unsplash.com/photo-1598327105666-5b89351cb31b?auto=format&fit=crop&w=400&q=80" alt="Product" class="h-full object-contain mix-blend-multiply group-hover:scale-105 transition duration-300">
                            <div class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2">
                                <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-gray-700 hover:text-red-500 hover:shadow-md transition transform translate-y-4 group-hover:translate-y-0"><i class="ph ph-heart text-xl"></i></button>
                            </div>
                        </div>
                        <div class="flex-1 flex flex-col">
                            <a href="product.html" class="block font-medium text-gray-800 hover:text-brand-600 transition line-clamp-2 mb-1">Samsung Galaxy S22 Ultra 5G</a>
                            <div class="flex items-center gap-1 mb-2">
                                <i class="ph-fill ph-star text-yellow-400 text-sm"></i>
                                <span class="text-xs text-gray-500">4.8 (315)</span>
                            </div>
                            <div class="mt-auto">
                                <div class="flex items-baseline gap-2 mb-3">
                                    <span class="text-lg font-bold text-brand-600">$1099.00</span>
                                </div>
                                <button class="w-full bg-brand-50 hover:bg-brand-600 text-brand-700 hover:text-white font-medium py-2 rounded-lg transition flex items-center justify-center gap-2 text-sm border border-brand-200 hover:border-brand-600">
                                    <i class="ph ph-shopping-cart-simple text-lg"></i> Add to Cart
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Product Card Skeleton Loader Example -->
                    <div class="bg-white border border-gray-100 rounded-xl p-4 flex flex-col animate-pulse hidden">
                        <div class="mb-4 h-48 bg-gray-200 rounded-lg"></div>
                        <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
                        <div class="h-4 bg-gray-200 rounded w-1/2 mb-4"></div>
                        <div class="h-3 bg-gray-200 rounded w-1/4 mb-4"></div>
                        <div class="mt-auto">
                            <div class="h-6 bg-gray-200 rounded w-1/3 mb-3"></div>
                            <div class="h-10 bg-gray-200 rounded w-full"></div>
                        </div>
                    </div>

                    <!-- Generate 6 more cards with similar structure -->
                    <script>
                        for(let i=0; i<6; i++) {
                            document.write(`
                            <div class="bg-white border border-gray-100 rounded-xl p-4 hover:shadow-lg transition relative group flex flex-col">
                                <div class="relative mb-4 h-48 bg-gray-50 rounded-lg overflow-hidden flex items-center justify-center p-4">
                                    <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?auto=format&fit=crop&w=400&q=80" alt="Product" class="h-full object-contain mix-blend-multiply group-hover:scale-105 transition duration-300">
                                    <div class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2">
                                        <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-gray-700 hover:text-red-500 hover:shadow-md transition transform translate-y-4 group-hover:translate-y-0"><i class="ph ph-heart text-xl"></i></button>
                                    </div>
                                </div>
                                <div class="flex-1 flex flex-col">
                                    <a href="product.html" class="block font-medium text-gray-800 hover:text-brand-600 transition line-clamp-2 mb-1">Smart Device ${i+1} Pro Max</a>
                                    <div class="flex items-center gap-1 mb-2">
                                        <i class="ph-fill ph-star text-yellow-400 text-sm"></i>
                                        <span class="text-xs text-gray-500">4.${Math.floor(Math.random() * 9)} (${Math.floor(Math.random() * 500)})</span>
                                    </div>
                                    <div class="mt-auto">
                                        <div class="flex items-baseline gap-2 mb-3">
                                            <span class="text-lg font-bold text-brand-600">$${Math.floor(Math.random() * 500) + 100}.00</span>
                                        </div>
                                        <button class="w-full bg-brand-50 hover:bg-brand-600 text-brand-700 hover:text-white font-medium py-2 rounded-lg transition flex items-center justify-center gap-2 text-sm border border-brand-200 hover:border-brand-600">
                                            <i class="ph ph-shopping-cart-simple text-lg"></i> Add to Cart
                                        </button>
                                    </div>
                                </div>
                            </div>
                            `);
                        }
                    </script>

                </div>

                <!-- Pagination -->
                <div class="flex items-center justify-center mt-12 mb-8">
                    <nav class="flex items-center gap-2">
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-50" disabled>
                            <i class="ph ph-caret-left"></i>
                        </button>
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg bg-brand-600 text-white font-medium shadow-md">1</button>
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 hover:border-brand-300 font-medium transition">2</button>
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 hover:border-brand-300 font-medium transition">3</button>
                        <span class="text-gray-400">...</span>
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 hover:border-brand-300 font-medium transition">10</button>
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 hover:border-brand-300 transition">
                            <i class="ph ph-caret-right"></i>
                        </button>
                    </nav>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
